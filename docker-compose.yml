services:
  postgres:
    image: postgres:16-alpine
    container_name: tasklist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasklist}
      POSTGRES_USER: ${POSTGRES_USER:-tasklist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasklist}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasklist} -d ${POSTGRES_DB:-tasklist}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./jtech-tasklist-backend
      dockerfile: Dockerfile
    container_name: tasklist-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROFILE: docker
      PORT: 8080
      DS_URL: postgres
      DS_PORT: 5432
      DS_DATABASE: ${POSTGRES_DB:-tasklist}
      DS_USER: ${POSTGRES_USER:-tasklist}
      DS_PASS: ${POSTGRES_PASSWORD:-tasklist}
      JWT_SECRET: ${JWT_SECRET:-change-me-super-secret-key-which-has-at-least-32chars}
      JWT_ACCESS_EXPIRATION_SECONDS: ${JWT_ACCESS_EXPIRATION_SECONDS:-3600}
      JWT_REFRESH_EXPIRATION_SECONDS: ${JWT_REFRESH_EXPIRATION_SECONDS:-1209600}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  frontend:
    build:
      context: ./jtech-tasklist-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: tasklist-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
